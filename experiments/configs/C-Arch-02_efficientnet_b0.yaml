experiment:
  id: C-Arch-02
  name: efficientnet_b0
  type: classification

model:
  name: efficientnet_b0
  framework: torch

dataset:
  path: yolo_wound_cls_dataset_v3
  version: v3
  num_classes: 7
  data_source: "Wound_dataset+Oversampling+Rotation"

training:
  epochs: 150
  batch: 32
  imgsz: 224
  seed: 42

optimizer:
  name: adam
  lr0: 0.001
  weight_decay: 0.0005

augmentation:
  fliplr: 0.5
  flipud: 0.5
  degrees: 45.0
  scale: 0.5
  erasing: 0.4

evaluation:
  metrics: [accuracy, top5, macro_f1, weighted_f1, confusion_matrix, roc_auc]

notes: "Tier1 Architecture Ablation - EfficientNet-B0 pretrained"
