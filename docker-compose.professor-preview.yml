services:
  woundcare:
    build: .
    restart: unless-stopped
    env_file: .env.professor-preview
    volumes:
      - ./models:/models:ro
      - ./professor_preview_data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - woundcare
    env_file: .env.professor-preview
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.professor-preview:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
